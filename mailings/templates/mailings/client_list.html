{% extends "base.html" %}

{% block title %}Список клиентов{% endblock %}

{% block content %}
    <h1>Список клиентов</h1>
    <a href="{% url 'client_create' %}" style="display: inline-block; margin-bottom: 1rem; padding: 0.5rem 1rem; background: #28a745; color: white; text-decoration: none; border-radius: 4px;">Добавить клиента</a>
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background: #f8f9fa;">
                <th style="padding: 0.75rem; text-align: left; border: 1px solid #dee2e6;">Email</th>
                <th style="padding: 0.75rem; text-align: left; border: 1px solid #dee2e6;">ФИО</th>
                <th style="padding: 0.75rem; text-align: left; border: 1px solid #dee2e6;">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
                <tr>
                    <td style="padding: 0.75rem; border: 1px solid #dee2e6;">{{ client.email }}</td>
                    <td style="padding: 0.75rem; border: 1px solid #dee2e6;">{{ client.full_name }}</td>
                    <td style="padding: 0.75rem; border: 1px solid #dee2e6;">
                        <a href="{% url 'client_update' client.pk %}" style="color: #007bff; text-decoration: none; margin-right: 1rem;">Редактировать</a>
                        <a href="{% url 'client_delete' client.pk %}" style="color: #dc3545; text-decoration: none;">Удалить</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
