{% extends "base.html" %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<h1>Добро пожаловать в сервис рассылок</h1>

<div class="stats" style="display: flex; justify-content: space-around; margin: 50px 0;">
    <div class="stat-card">
        <h3>Всего рассылок</h3>
        <div class="stat-value">{{ total_mailings }}</div>
    </div>

    <div class="stat-card">
        <h3>Активных рассылок</h3>
        <div class="stat-value">{{ active_mailings }}</div>
    </div>

    <div class="stat-card">
        <h3>Уникальных клиентов</h3>
        <div class="stat-value">{{ unique_clients }}</div>
    </div>
</div>
{% endblock %}
