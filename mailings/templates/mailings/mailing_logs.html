<!DOCTYPE html>
<html>
<head>
    <title>Логи рассылки</title>
</head>
<body>
    <h1>Логи рассылки #{{ mailing_id }}</h1>
    <table border="1">
        <tr>
            <th>Дата</th>
            <th>Клиент</th>
            <th>Статус</th>
            <th>Ответ сервера</th>
        </tr>
        {% for log in logs %}
            <tr>
                <td>{{ log.timestamp }}</td>
                <td>{{ log.client.email }}</td>
                <td>{{ log.get_status_display }}</td>
                <td>{{ log.server_response|default:"-" }}</td>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
