{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>Вход в систему</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary mt-3">Войти</button>
                        <a href="{% url 'account_reset_password' %}" class="btn btn-link">Забыли пароль?</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
